name: Verify Florida Stage 1 Sources

# Manual trigger ONLY -- no schedule, so no crawl or verification run happens
# without a human clicking the button. Scope is hard-coded to the existing
# 10-lead Florida validation set: this workflow discovers nothing new, calls
# no search API, and touches no state other than FL (also enforced inside
# scripts/verify_sources.py itself as a second safety net).
#
# PHASE A: verification uses only free, no-API-key public sources (direct
# fetch, Wayback Machine, ProPublica Nonprofit Explorer) -- no Google/Bing
# search API, no scraping proxy, no anti-bot-bypass or contact-guessing
# service of any kind. Nothing in Phase A requires a secret.
#
# PHASE B: adds Tavily as a search-discovery layer, still scoped to the same
# 10 leads only. The API key comes solely from the TAVILY_API_KEY repository
# secret below -- it is never hardcoded, never logged, and never committed.
# If the secret isn't set, scripts/verify_with_tavily.py no-ops with a clear
# message and makes no calls and no data changes.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: verify-florida-stage1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No API keys/secrets are used anywhere in this workflow: verification
      # fetches public pages directly over normal outbound HTTPS, it does not
      # call any search API or paid service.
      - name: Load the 10 Florida Stage 1 seed leads (idempotent -- dedupes, never duplicates)
        run: python scripts/load_leads.py data/seed/florida_stage1_leads.json

      - name: Run real source-page verification (Florida only, robots.txt-respecting, rate-limited)
        run: python scripts/verify_sources.py

      # TAVILY_API_KEY is read from this repo's Actions secret and mapped to
      # an env var here -- it is never printed, echoed, or written to any
      # committed file. If the secret is unset, this step no-ops (see the
      # script's own SKIPPED_NO_API_KEY log message) rather than failing.
      - name: Run Phase B search-discovery verification (Tavily, existing 10 leads only)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/verify_with_tavily.py

      - name: Generate QA report
        run: python scripts/qa_report.py | tee qa_report_output.txt

      # No GOOGLE_SHEETS_* secrets are configured yet, so this always runs in
      # dry-run mode: it writes a local CSV preview of exactly what would be
      # pushed to a Sheet, without calling any Google API.
      - name: Build Google Sheets export preview (dry run -- no credentials configured)
        run: python scripts/export_to_sheets.py

      - name: Upload QA report, verification log, and Sheets preview as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: florida-stage1-verification-results
          path: |
            qa_report_output.txt
            data/verification_log.json
            data/tavily_log.json
            data/sheets_export_preview.csv
          retention-days: 90

      - name: Commit updated database and verification logs back to the repo
        run: |
          git config user.name "fundraising123-lead-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fundraising123.db data/verification_log.json data/tavily_log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Florida Stage 1 verification results [skip ci]"
            git push
          fi
